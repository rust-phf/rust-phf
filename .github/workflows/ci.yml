name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
          version: 1.31.1

  cross:
    name: Cross-platform hashing (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-gnu
            compiler: gcc-i686-linux-gnu
            linker: i686-linux-gnu-gcc
            runner: qemu-i386 -L /usr/i686-linux-gnu
          - target: s390x-unknown-linux-gnu
            compiler: gcc-s390x-linux-gnu
            linker: s390x-linux-gnu-gcc
            runner: qemu-s390x -L /usr/s390x-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cross-compilation tools
        env:
          CROSS_COMPILER: ${{ matrix.compiler }}
          CROSS_TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user "$CROSS_COMPILER"
          rustup target add "$CROSS_TARGET"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Test host-generated tables on the target
        env:
          CROSS_TARGET: ${{ matrix.target }}
          CROSS_LINKER: ${{ matrix.linker }}
          CROSS_RUNNER: ${{ matrix.runner }}
        run: |
          target_env="${CROSS_TARGET//-/_}"
          target_env="${target_env^^}"
          export "CARGO_TARGET_${target_env}_LINKER"="$CROSS_LINKER"
          export "CARGO_TARGET_${target_env}_RUNNER"="$CROSS_RUNNER"
          cargo test --workspace --locked --target "$CROSS_TARGET"
          cargo test --workspace --all-features --locked --target "$CROSS_TARGET"

  ci:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MSRV and nightly
        version: [1.85.0, stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set toolchain
        run: |
          rustup set profile minimal
          rustup override set ${{ matrix.version }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Rustfmt check
        if: matrix.version == '1.85.0'
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

      - name: Run `cargo test` on workspace
        if: matrix.version != '1.85.0'
        run: cargo test --workspace --exclude=phf_codegen_test --exclude=phf_macros_no_macros_test

      - name: phf_macros test without phf/macros
        if: matrix.version != '1.85.0'
        run: cargo test -p phf_macros_no_macros_test

      - name: phf_macros ptrhash test without phf/macros
        if: matrix.version != '1.85.0'
        run: cargo test -p phf_macros_no_macros_test --features ptrhash

      - name: phf_codegen test
        if: matrix.version != '1.85.0'
        run: cargo test -p phf_codegen_test

      - name: trybuild test
        if: matrix.version == 'stable'
        run: cargo test -p phf_macros_test -- --ignored

      - name: no_std build check
        working-directory: phf
        run: cargo build --no-default-features

      - name: all features check
        run: cargo check --workspace --all-features

      - name: ptrhash tests
        if: matrix.version != '1.85.0'
        run: cargo test -p phf_generator -p phf_macros_test -p phf_codegen_test --features ptrhash

      - name: unicase + macros features check
        run: cargo check -p unicase-example

      - name: deny check
        if: matrix.version == 'stable'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
