[package]
name = "phf_shared"
authors = ["Steven Fackler <sfackler@gmail.com>"]
version = "0.14.0"
license = "MIT"
description = "Support code shared by PHF libraries"
repository = "https://github.com/rust-phf/rust-phf"
edition = "2024"
rust-version = "1.85"
categories = ["data-structures"]
readme = "README.md"

[lib]
name = "phf_shared"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
ptrhash = []

[dependencies]
# Generated tables require identical hash output on the host and target.
# Pin the version because foldhash does not promise stability across releases.
foldhash = { package = "foldhash-portable", version = "=0.2.1", default-features = false, features = ["portable"] }
unicase = { version = "2.8.1", optional = true }
uncased = { version = "0.9.9", optional = true, default-features = false }
